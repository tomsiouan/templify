page:
  size: A4
  margins:
    top: 25mm
    right: 20mm
    bottom: 25mm
    left: 25mm

font:
  family: Inter
  url: https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap
  # faces: self-hosts the font instead of linking url above, which is what
  # keeps copy-pasted PDF text intact (see "Self-hosting fonts" in the docs).
  # Run `templify -fetch-fonts -config this-file.yml` to download the files
  # behind url and print the faces: block to paste here.
  # faces:
  #   - file: ./fonts/inter-400.woff2
  #     weight: 400
  #   - file: ./fonts/inter-600.woff2
  #     weight: 600
  size: 11pt
  line_height: 1.6

headings:
  h1:
    size: 24pt
    page_break_before: false
  h2:
    size: 18pt
    page_break_before: false
  h3:
    size: 14pt
    page_break_before: false
  h4:
    size: 12pt
    page_break_before: false
  h5:
    size: 11pt
    page_break_before: false
  h6:
    size: 10pt
    page_break_before: false

justify: false
paragraph_indent: 13mm
heading_indent: "" # indentation step per sub-level: h3 = 1×, h4 = 2×, h5 = 3× (e.g. "5mm")
heading_numbers:
  enabled: false # prefix h2+ with 1 / 1.1 / 1.1.1 counters (also applied to TOC)
  exclude: [] # heading texts that must not be numbered (e.g. Introduction, Conclusion)

toc:
  enabled: true
  max_depth: 2
  exclude: []   # heading texts to omit from the TOC entirely (e.g. Remerciements)
  pre_toc: []   # heading texts to extract from body and place before the TOC (e.g. Remerciements)

header:
  enabled: false
  background: "" # CSS background value, supports gradients e.g. "linear-gradient(to right, #1e293b, #475569)"
  left: ""
  center: ""
  right: ""

footer:
  enabled: true
  background: "" # CSS background value, supports gradients
  left: ""
  center: ""
  right: "{page} / {pages}" # supports {page} and {pages} tokens

blank_page: false

colors:
  primary: "#1e293b"
  primary_light: "#475569"
  background: "#f8fafc"
  text: "#0f172a"
  text_muted: "#64748b"

code:
  theme: monokai # syntax highlighting theme; run `templify -code-themes` for the list, "none" to disable
  background: "" # override the theme's panel background (e.g. "#3b4252"); "none" removes the panel entirely
  foreground: "" # override the theme's default text color
  font_family: JetBrains Mono
  font_url: https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap
  # faces: same self-hosting mechanism as font.faces above, for the code font.
  # faces:
  #   - file: ./fonts/jetbrains-mono-400.woff2
  #     weight: 400
  #   - file: ./fonts/jetbrains-mono-700.woff2
  #     weight: 700
  font_size: 8.5pt
  line_height: 1.45
  line_numbers: false # only applies to fences naming a language; use ```text for plain blocks
  wrap: true # wrap long lines instead of letting them overflow the page
  keep_together_lines: 25 # blocks up to this many lines are never split across pages; 0 disables

cover:
  enabled: true
  template: "" # path to a custom cover .html template (relative to this config file)
