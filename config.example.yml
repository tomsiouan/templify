page:
  size: A4
  margins:
    top: 25mm
    right: 20mm
    bottom: 25mm
    left: 25mm

font:
  family: Inter
  url: https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap
  size: 11pt
  line_height: 1.6

headings:
  h1:
    size: 24pt
    page_break_before: false
  h2:
    size: 18pt
    page_break_before: false
  h3:
    size: 14pt
    page_break_before: false
  h4:
    size: 12pt
    page_break_before: false
  h5:
    size: 11pt
    page_break_before: false
  h6:
    size: 10pt
    page_break_before: false

justify: false

toc:
  enabled: true
  max_depth: 2

page_numbers:
  enabled: true
  format: "{page} / {pages}"

blank_page: false

colors:
  primary: "#1e293b"
  primary_light: "#475569"
  background: "#f8fafc"
  text: "#0f172a"
  text_muted: "#64748b"
