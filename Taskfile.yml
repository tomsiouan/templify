version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  build:
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o build/templify .

  test:
    cmds:
      - go test ./...

  clean:
    cmds:
      - rm -rf build/ examples/*.pdf /tmp/templify-*.pdf

  run:
    cmds:
      - ./build/templify -input examples/example.md -bundle report -output examples/example.pdf -config ./config.yml

  invoice:
    cmds:
      - ./build/templify -input examples/example-invoice.md -bundle invoice -config examples/invoice.yml -output examples/example-invoice.pdf

  quote:
    cmds:
      - ./build/templify -input examples/example-quote.md -bundle quote -config examples/quote.yml -output examples/example-quote.pdf

  docs:
    dir: docs
    cmds:
      - hugo server --buildDrafts --bind 0.0.0.0

  docs:build:
    dir: docs
    cmds:
      - hugo --minify

  default:
    cmds:
      - task: build
      - task: run
