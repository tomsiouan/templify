baseURL = "https://tomsiouan.github.io/templify/"
title = "templify"
locale = "en"
defaultContentLanguage = "en"

[module]
[[module.imports]]
  path = "github.com/imfing/hextra"

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "Convert Markdown files to styled PDFs using a bundle-driven template system."

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.footer]
    enable = true
    displayCopyright = true

  [params.editPage]
    enable = false
